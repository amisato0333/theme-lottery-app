<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お題くじ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">

    <meta name="theme-color" content="#53627c">
</head>

<body>

    <main class="container">
        <header class="app-header">

            <img src="./icons/icon-192.png" alt="お題くじ" class="app-logo">

            <div class="app-title-area">
                <h1>お題くじ｜キャラクターデザイン・イラストのお題メーカー</h1>

                <meta name="description" content="服ジャンル・世界観・モチーフ・追加縛りをランダムに組み合わせて、キャラクターデザインやイラストのお題を作れる無料のお題メーカーです。">

                <meta name="robots" content="index, follow">


                <p class="app-description">
                    服ジャンル・世界観・モチーフなどを組み合わせて、<br>
                    キャラクターデザインやイラストのお題をランダムに生成できる無料のお題メーカーです。
                </p>

                <p class="app-note">
                    ※「お題管理」でチェックが入っているお題のみ、くじに反映されます。
                </p>
            </div>

            <a href="manage.html" class="manage-link">
                お題を管理する
            </a>

        </header>

        <section class="draw-area">

            <h2>今回くじに入れるカテゴリ</h2>

            <div class="category-checks">

                <label>
                    <input type="checkbox" class="draw-category" value="fashion" checked>
                    服ジャンル
                </label>

                <label>
                    <input type="checkbox" class="draw-category" value="world" checked>
                    世界観
                </label>

                <label>
                    <input type="checkbox" class="draw-category" value="motif" checked>
                    モチーフ
                </label>

                <label>
                    <input type="checkbox" class="draw-category" value="rule">
                    追加縛り
                </label>

            </div>

            <button id="drawButton">お題を引く</button>

            <div id="result">
                ここに結果が出ます
            </div>

            <button id="unlockAllButton">
                固定をすべて解除
            </button>

        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
